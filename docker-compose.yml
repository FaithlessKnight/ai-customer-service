# ============================================================
# AI Customer Service - Docker Compose
# 包含所有依赖服务：PostgreSQL / Milvus / Redis / Ollama / Nginx
# 多实例部署：3 个 API 实例 + Nginx 负载均衡
# ============================================================
# 使用方式：
#   cp .env.example .env   # 填入真实配置
#   docker compose up -d   # 启动全部服务
#   docker compose logs -f api-1 api-2 api-3  # 查看 API 日志
#
# 扩缩容：
#   增加实例：在 services 中添加 api-4 等，并更新 deploy/nginx.conf 的 upstream
#   减少实例：移除对应 service + nginx upstream 条目
# ============================================================

# 公共配置锚点（YAML anchor，避免重复）
x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    PG_HOST: postgres
    MILVUS_HOST: milvus-standalone
    REDIS_URL: redis://redis:6379
    OLLAMA_BASE_URL: http://ollama:11434
    STAGING_ROOT: /app/data/staging
    DATA_UPLOAD_DIR: /app/data/uploads
  volumes:
    - api_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    milvus-standalone:
      condition: service_healthy
  networks:
    - ai-cs-net
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:

  # ── API 实例 1~3（Nginx 负载均衡）────────────────────────
  api-1:
    <<: *api-common
    container_name: ai-cs-api-1

  api-2:
    <<: *api-common
    container_name: ai-cs-api-2

  api-3:
    <<: *api-common
    container_name: ai-cs-api-3

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: ${PG_DATABASE:-agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-cs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-cs-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-cs-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Milvus（单机模式）────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: ai-cs-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ai-cs-net

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: ai-cs-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - ai-cs-net

  milvus-standalone:
    image: milvusdb/milvus:v2.4.13
    container_name: ai-cs-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    networks:
      - ai-cs-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # ── Ollama（本地 Embedding 模型）────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai-cs-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-cs-net
    # GPU 支持（有 NVIDIA GPU 时取消注释）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Nginx 反向代理 ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-cs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # HTTPS 证书目录
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - ai-cs-net

# ── 数据卷 ───────────────────────────────────────────────────
volumes:
  api_data:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:

# ── 网络 ─────────────────────────────────────────────────────
networks:
  ai-cs-net:
    driver: bridge

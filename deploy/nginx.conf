# ============================================================
# Nginx 反向代理配置
# 支持 HTTP → HTTPS 跳转 + WebSocket（SSE 流式响应）
# 多实例负载均衡（round-robin）
# ============================================================
# 使用方式：
#   1. 将域名替换为你的实际域名
#   2. 将 SSL 证书放入 deploy/certs/ 目录
#   3. 无 HTTPS 时只保留 server 80 块即可
#   4. 扩缩容时同步更新 upstream 中的实例列表
# ============================================================

# 后端实例池（round-robin 负载均衡）
# 每个 api 实例对应一个 server 条目
upstream api_backend {
    # 默认 round-robin 策略，请求轮流分配到各实例
    # 也可改为 least_conn（最少连接优先，更适合长请求）
    least_conn;

    server api-1:8000 max_fails=3 fail_timeout=30s;
    server api-2:8000 max_fails=3 fail_timeout=30s;
    server api-3:8000 max_fails=3 fail_timeout=30s;

    # 扩容时添加更多实例：
    # server api-4:8000 max_fails=3 fail_timeout=30s;
    # server api-5:8000 max_fails=3 fail_timeout=30s;
    # server api-6:8000 max_fails=3 fail_timeout=30s;

    keepalive 32;  # 保持连接复用，减少 TCP 握手开销
}

# 限流区（防刷）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# ── HTTP → HTTPS 跳转 ────────────────────────────────────
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 证书续签验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com www.your-domain.com;

    # SSL 证书（替换为实际路径）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 文件上传大小限制
    client_max_body_size 50M;

    # ── API 代理 ─────────────────────────────────────────
    location / {
        # 限流（对 /cs 接口生效）
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # 连接复用（配合 upstream keepalive）
        proxy_set_header Connection "";

        # WebSocket / SSE 支持
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # 流式对话超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ── 管理后台（限制来源 IP）────────────────────────────
    location /admin/ {
        # 生产环境建议限制只允许内网 IP 访问
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 健康检查（不限流）────────────────────────────────
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    # ── API 文档（可选：生产环境关闭）────────────────────
    location /docs {
        proxy_pass http://api_backend;
    }
    location /openapi.json {
        proxy_pass http://api_backend;
    }

    # ── gzip 压缩 ─────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain text/html;
    gzip_min_length 1024;
}
